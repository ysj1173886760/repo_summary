name: Repo Summary

on:
  schedule:
    # Every Monday at 01:00 UTC (≈ 09:00 Beijing time).
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated owner/repo list (blank = PyTorch ecosystem default)"
        required: false
        default: ""
      days:
        description: "Window width in days"
        required: false
        default: "7"
      backfill:
        description: "Number of contiguous windows to generate (e.g. 4 = past 4 weeks, one report each)"
        required: false
        default: "1"
      skip_generate:
        description: "Only push existing reports to Feishu, don't generate new ones"
        type: boolean
        required: false
        default: false
      cold_start:
        description: "First push to a repo's Feishu group: send only the latest N historical reports (-1 = all)"
        required: false
        default: "4"

# Allow the workflow to commit the generated reports back to the repository.
permissions:
  contents: write

# The push state file is committed back, so runs must not overlap.
concurrency:
  group: repo-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate summaries
        if: github.event.inputs.skip_generate != 'true'
        env:
          # GITHUB_TOKEN is provided automatically; used to raise GitHub API rate limits.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_MODEL: deepseek/deepseek-v4-pro
        run: |
          REPOS="${{ github.event.inputs.repos }}"
          DAYS="${{ github.event.inputs.days }}"
          BACKFILL="${{ github.event.inputs.backfill }}"
          ARGS=""
          if [ -n "$REPOS" ]; then ARGS="$ARGS --repos $REPOS"; fi
          if [ -n "$DAYS" ]; then ARGS="$ARGS --days $DAYS"; fi
          if [ -n "$BACKFILL" ]; then ARGS="$ARGS --backfill $BACKFILL"; fi
          python main.py $ARGS

      - name: Push reports to Feishu
        if: success() || failure()
        env:
          FEISHU_WEBHOOKS: ${{ secrets.FEISHU_WEBHOOKS }}
        run: |
          COLD_START="${{ github.event.inputs.cold_start }}"
          python -m repo_summary.push ${COLD_START:+--cold-start $COLD_START}

      # Always commit so reports and push state survive a partial failure.
      - name: Commit and push reports
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore: update repo summaries ($(date -u +%Y-%m-%d))"
            git push
          fi
